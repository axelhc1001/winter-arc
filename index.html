<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Arc</title>
<meta name="theme-color" content="#070c17">
<meta name="description" content="Registro diario y tabla del Winter Arc PALADIUM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<script src="config.js?v=5"></script>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap">
  <header>
    <h1>WINTER <span>ARC</span></h1>
    <div class="sub" id="sub">1 oct – 23 dic 2026</div>
    <div class="prog"><i id="progbar" style="width:0"></i></div>
    <div class="who hide" id="who"><span class="me" id="whoName"></span><button data-act="reglas">📜 Reglas</button></div>
  </header>
  <div id="setup" class="banner hide">Falta conectar la base de datos (config.js).</div>
  <main id="view"></main>
</div>
<nav id="nav" class="hide">
  <button data-v="hoy"><b>✅</b>Hoy</button>
  <button data-v="tabla"><b>🏆</b>Tabla</button>
  <button data-v="muro"><b>📸</b>Muro</button>
  <button data-v="carrera"><b>🏁</b>Carrera</button>
  <button data-v="yo"><b>👤</b>Yo</button>
</nav>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<input type="file" id="fileIn" accept="image/*" class="hide">
<script src="app.js?v=5"></script>
</body>
</html>
