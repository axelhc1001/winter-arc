name: Recordatorio 10 pm

on:
  schedule:
    # Varios intentos porque GitHub puede atrasar los cron; solo el primero dentro de 10–11:59 pm manda.
    - cron: '0 4 * * *'    # 10:00 pm CDMX
    - cron: '20 4 * * *'   # 10:20 pm
    - cron: '45 4 * * *'   # 10:45 pm
    - cron: '15 5 * * *'   # 11:15 pm
  workflow_dispatch:
    inputs:
      todos:
        description: 'Mandar a todos los suscritos (prueba)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar web-push
        working-directory: push
        run: npm install --no-save --no-package-lock web-push@3
      - name: Mandar recordatorios
        working-directory: push
        run: node send.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TODOS: ${{ inputs.todos }}
      # GitHub apaga los cron de repos sin actividad en 60 días: un commit cada lunes lo mantiene vivo.
      - name: Latido semanal
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(cat push/latido.txt 2>/dev/null | cut -c1-10)" != "$(date -u +%F)" ]; then
            date -u +%F > push/latido.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add push/latido.txt
            git commit -m "Latido del recordatorio" && git push
          fi
